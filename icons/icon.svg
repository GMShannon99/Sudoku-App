<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: a stylized sudoku board, colors matched to index.html's
       root theme custom properties (bg, board-bg, board-edge, line,
       line-soft, accent). Full-bleed dark background with the board kept
       inside the maskable safe zone, so this one source works for both
       the "any" and "maskable" manifest icon entries. -->
  <rect width="512" height="512" fill="#211b16"/>
  <rect x="111" y="111" width="290" height="290" rx="14" fill="#f2e8d5" stroke="#3a2c1f" stroke-width="8"/>
  <g stroke="#b8a37f" stroke-width="1.5">
    <line x1="154.9" y1="126" x2="154.9" y2="386"/>
    <line x1="183.8" y1="126" x2="183.8" y2="386"/>
    <line x1="241.6" y1="126" x2="241.6" y2="386"/>
    <line x1="270.4" y1="126" x2="270.4" y2="386"/>
    <line x1="328.2" y1="126" x2="328.2" y2="386"/>
    <line x1="357.1" y1="126" x2="357.1" y2="386"/>
    <line x1="126" y1="154.9" x2="386" y2="154.9"/>
    <line x1="126" y1="183.8" x2="386" y2="183.8"/>
    <line x1="126" y1="241.6" x2="386" y2="241.6"/>
    <line x1="126" y1="270.4" x2="386" y2="270.4"/>
    <line x1="126" y1="328.2" x2="386" y2="328.2"/>
    <line x1="126" y1="357.1" x2="386" y2="357.1"/>
  </g>
  <g stroke="#6b4a32" stroke-width="4">
    <line x1="212.7" y1="126" x2="212.7" y2="386"/>
    <line x1="299.3" y1="126" x2="299.3" y2="386"/>
    <line x1="126" y1="212.7" x2="386" y2="212.7"/>
    <line x1="126" y1="299.3" x2="386" y2="299.3"/>
  </g>
  <rect x="126" y="126" width="260" height="260" fill="none" stroke="#6b4a32" stroke-width="4"/>
  <g fill="#a63a32">
    <rect x="161.33" y="161.33" width="16" height="16" rx="3"/>
    <rect x="248" y="190.22" width="16" height="16" rx="3"/>
    <rect x="334.67" y="305.78" width="16" height="16" rx="3"/>
    <rect x="190.22" y="334.67" width="16" height="16" rx="3"/>
