name: Update Puzzle Stats

on:
  schedule:
    - cron: '0 8 * * 1'   # 8:00 AM UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch stats from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_CODE: sudoku-gilshannon
        run: python scripts/fetch_goatcounter_stats.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-snapshot.json
          git diff --staged --quiet || git commit -m "Update visitor stats snapshot"
          git push
